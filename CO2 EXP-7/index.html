<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Quiz Application</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>Online Quiz Application</h2>

<form id="quizForm">

<div class="question">
<p>1. HTML stands for?</p>
<label><input type="radio" name="q1" value="a"> Hyper Text Markup Language</label>
<label><input type="radio" name="q1" value="b"> High Text Machine Language</label>
<label><input type="radio" name="q1" value="c"> Hyper Transfer Markup Language</label>
</div>

<div class="question">
<p>2. Which language is used for styling web pages?</p>
<label><input type="radio" name="q2" value="a"> HTML</label>
<label><input type="radio" name="q2" value="b"> CSS</label>
<label><input type="radio" name="q2" value="c"> Python</label>
</div>

<div class="question">
<p>3. Which language is used for web page interactivity?</p>
<label><input type="radio" name="q3" value="a"> JavaScript</label>
<label><input type="radio" name="q3" value="b"> Java</label>
<label><input type="radio" name="q3" value="c"> C++</label>
</div>

<div class="question">
<p>4. Which HTML tag is used to insert an image?</p>
<label><input type="radio" name="q4" value="a">&lt;image&gt;</label>
<label><input type="radio" name="q4" value="b">&lt;img&gt;</label>
<label><input type="radio" name="q4" value="c">&lt;pic&gt;</label>
</div>

<div class="question">
<p>5. CSS stands for?</p>
<label><input type="radio" name="q5" value="a">Creative Style Sheets</label>
<label><input type="radio" name="q5" value="b">Computer Style Sheets</label>
<label><input type="radio" name="q5" value="c">Cascading Style Sheets</label>
</div>

<button type="button" onclick="calculateScore()">Submit Quiz</button>

</form>

<h3 id="result"></h3>

</div>

<script src="script.js"></script>

</body>
</html>
