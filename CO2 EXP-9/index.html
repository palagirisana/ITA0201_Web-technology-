<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart and Billing System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>Product Shopping Cart</h2>

<label>Select Product</label>

<select id="product">
<option value="500">Laptop - ₹500</option>
<option value="300">Headphones - ₹300</option>
<option value="200">Keyboard - ₹200</option>
<option value="150">Mouse - ₹150</option>
</select>

<label>Quantity</label>

<input type="number" id="quantity" min="1" value="1">

<button onclick="generateBill()">Generate Bill</button>

<div id="bill"></div>

</div>

<script src="script.js"></script>

</body>
</html>
