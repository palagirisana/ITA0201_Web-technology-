<!DOCTYPE html>
<html>
<head>
    <title>Visitor Counter</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #3366ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #2244cc;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Thread-Safe Visitor Counter</h1>

    <p>
        Click the button to access the servlet.
    </p>

    <a href="visitor">Visit Servlet</a>

</div>

</body>
</html>
