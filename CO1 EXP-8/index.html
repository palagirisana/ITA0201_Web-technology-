<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframes</title>
</head>

<body>

<h1 align="center">Webpage Using Images, Hyperlinks, and Iframes</h1>

<hr>

<h2>College Image</h2>

<img src="images/college.jpg"
     alt="College Campus"
     width="500"
     height="300">

<hr>

<h2>Useful Hyperlinks</h2>

<p>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>
</p>

<p>
    <a href="https://www.github.com" target="_blank">
        Visit GitHub
    </a>
</p>

<p>
    <a href="https://www.wikipedia.org" target="_blank">
        Visit Wikipedia
    </a>
</p>

<hr>

<h2>Embedded Webpage Using Iframe</h2>

<iframe
    src="https://www.wikipedia.org"
    width="700"
    height="400"
    title="Wikipedia">
</iframe>

</body>
</html>
