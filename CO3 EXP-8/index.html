<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Result Processing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            border-color: #4f46e5;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #7c3aed, #2563eb);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Result Processing</h1>

    <p class="subtitle">
        Enter student details and marks
    </p>

    <form action="result" method="post">

        <label for="name">Student Name</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter student name"
               required>

        <label for="regno">Register Number</label>
        <input type="text"
               id="regno"
               name="regno"
               placeholder="Enter register number"
               required>

        <label for="sub1">Subject 1 Mark</label>
        <input type="text"
               id="sub1"
               name="sub1"
               placeholder="Enter mark (0-100)"
               required>

        <label for="sub2">Subject 2 Mark</label>
        <input type="text"
               id="sub2"
               name="sub2"
               placeholder="Enter mark (0-100)"
               required>

        <label for="sub3">Subject 3 Mark</label>
        <input type="text"
               id="sub3"
               name="sub3"
               placeholder="Enter mark (0-100)"
               required>

        <label for="sub4">Subject 4 Mark</label>
        <input type="text"
               id="sub4"
               name="sub4"
               placeholder="Enter mark (0-100)"
               required>

        <label for="sub5">Subject 5 Mark</label>
        <input type="text"
               id="sub5"
               name="sub5"
               placeholder="Enter mark (0-100)"
               required>

        <button type="submit">
            Calculate Result
        </button>

    </form>

</div>

</body>
</html>
